name: Publier un APK signé
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag correspondant à versionName (ex. v0.1.0)'
        required: true
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      - name: Préparer la signature privée
        env:
          KEYSTORE_BASE64: ${{ secrets.VICKTV_KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_BASE64" || { echo 'Configurer les secrets de signature avant de publier.'; exit 1; }
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/vicktv.jks"
      - name: Vérifier et compiler
        env:
          VICKTV_KEYSTORE: ${{ runner.temp }}/vicktv.jks
          VICKTV_STORE_PASSWORD: ${{ secrets.VICKTV_STORE_PASSWORD }}
          VICKTV_KEY_PASSWORD: ${{ secrets.VICKTV_KEY_PASSWORD }}
        run: chmod +x gradlew && ./gradlew testDebugUnitTest lintDebug assembleRelease --no-daemon
      - name: Préparer les fichiers
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk dist/VickTV.apk
          python3 tools/release_metadata.py --apk dist/VickTV.apk --tag "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY"
          cd dist && sha256sum VickTV.apk > SHA256SUMS.txt
      - name: Publier la release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          gh release create "$RELEASE_TAG" dist/VickTV.apk dist/update.json dist/SHA256SUMS.txt --title "VickTV $RELEASE_TAG" --notes-file docs/RELEASE_NOTES.md --verify-tag
      - name: Nettoyer la signature
        if: always()
        run: rm -f "$RUNNER_TEMP/vicktv.jks"
